<!DOCTYPE html>
<!--
  Hand-review queue for deduplication.py's *_review.jsonl files.

      python3 deduplication.py questions_*/tache2.jsonl --mode tfidf
      open review.html          # then pick tache2_tfidf_review.jsonl

  A single self-contained file on purpose: no build step, no server, no
  dependency to keep current. It is a tool for the person maintaining the
  question bank, not part of the deployed site, so it deliberately lives
  outside frontend/ and never touches the API.

  Everything runs in the browser. Decisions are kept in localStorage keyed by
  the loaded file's name, so closing the tab mid-queue loses nothing, and
  "Export" writes them back out as JSONL.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dedup review</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16181d; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb;
    --merge: #0f7b4f; --merge-bg: #e7f6ee;
    --reject: #b3261e; --reject-bg: #fdecea;
    --add: #d6f0dd; --del: #fbdcd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --ink: #e8eaed; --muted: #9aa2ad;
      --line: #2c313a; --accent: #7aa2f7;
      --merge: #6ee7a8; --merge-bg: #16311f;
      --reject: #ff9c94; --reject-bg: #3a1a17;
      --add: #1f4430; --del: #4a201d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
  .spacer { flex: 1; }
  .counts { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .counts b { color: var(--ink); }
  button, select, label.file {
    font: inherit; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  button:hover, label.file:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  input[type=file] { display: none; }

  .bar { height: 3px; background: var(--line); }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }

  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 20px; }
  .empty code { background: var(--card); padding: 2px 6px; border-radius: 4px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-left-width: 4px;
    border-radius: 10px; margin-bottom: 14px; padding: 14px 16px; outline: none;
  }
  .card:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(37 99 235 / .18); }
  .card[data-decision="merge"]  { border-left-color: var(--merge);  background: var(--merge-bg); }
  .card[data-decision="reject"] { border-left-color: var(--reject); background: var(--reject-bg); }
  .card[data-decision=""]       { border-left-color: var(--line); }

  .meta {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    color: var(--muted); font-size: 12.5px; margin-bottom: 10px;
  }
  .score {
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  .side h3 {
    margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
  .side .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .text { white-space: pre-wrap; }
  ins { background: var(--add); text-decoration: none; border-radius: 3px; }
  del { background: var(--del); text-decoration: none; border-radius: 3px; }

  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .actions .verdict { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  button.merge[aria-pressed="true"]  { background: var(--merge);  border-color: var(--merge);  color: #fff; }
  button.reject[aria-pressed="true"] { background: var(--reject); border-color: var(--reject); color: #fff; }

  .abstract {
    font-size: 15.5px; font-weight: 650; margin-bottom: 8px;
    display: flex; gap: 8px; align-items: baseline;
  }
  .abstract::before {
    content: "abstract"; font: 11px ui-monospace, Menlo, monospace;
    color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
  }
  .question { white-space: pre-wrap; margin-bottom: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.chip { font-variant-numeric: tabular-nums; }
  button.chip[aria-pressed="true"] { background: var(--merge); border-color: var(--merge); color: #fff; }
  button.chip .who { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
  button.chip[aria-pressed="true"] .who { color: #fff; opacity: .8; }
  .card[data-decision="chosen"] { border-left-color: var(--merge); background: var(--merge-bg); }
  .pairtag {
    font: 11.5px ui-monospace, Menlo, monospace; border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 6px;
  }

  kbd {
    font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Review</h1>
  <label class="file">
    Load .jsonl<input id="file" type="file" accept=".jsonl,.json,.txt">
  </label>
  <span id="filename" class="counts"></span>
  <span class="spacer"></span>
  <span class="counts" id="counts"></span>
  <select id="pairfilter" title="Which label pair to work on" hidden></select>
  <select id="filter" title="Which rows to show">
    <option value="all">All</option>
    <option value="undecided">Undecided</option>
    <option value="merge">Merged</option>
    <option value="reject">Rejected</option>
  </select>
  <button id="export" disabled>Export decisions</button>
  <button id="clear" disabled title="Forget every decision for this file">Reset</button>
</header>
<div class="bar"><div id="progress"></div></div>

<main>
  <div id="list"></div>
  <div id="empty" class="empty">
    <p>Drop a file anywhere on this page, or pick one:</p>
    <p><code>*_review.jsonl</code> from <code>deduplication.py</code> &mdash; are these two questions the same?<br>
       <code>*_disagreements.jsonl</code> from <code>compare.py</code> &mdash; which label is right?</p>
    <p><kbd>j</kbd> / <kbd>k</kbd> move &nbsp; <kbd>m</kbd>/<kbd>r</kbd> merge/reject &nbsp;
       <kbd>1</kbd>&hellip;<kbd>9</kbd> pick a label &nbsp; <kbd>u</kbd> undo</p>
  </div>
</main>

<script>
"use strict";

// ---------------------------------------------------------------- state ----
// Two input shapes, one page:
//   dedup  {score, a, b, a_id, b_id}      "are these the same question?"
//   label  {id, pair, labels, text}       "which of these labels is right?"
// The queue, progress, localStorage, filtering and export are identical; only
// the card body and what a decision *is* differ.
let MODE = "dedup";
let pairs = [];        // rows from the jsonl, in file order
let decisions = {};    // key -> "merge" | "reject" (dedup) | a label (label mode)
let storeKey = null;   // localStorage key for the loaded file
let vocabulary = [];   // every label seen in a label-mode file

// a_id/b_id or id identify a row independently of its position, so decisions
// survive a re-run that reorders or re-scores the queue
const keyOf = (p) => MODE === "dedup" ? `${p.a_id}|${p.b_id}` : String(p.id);

const $ = (id) => document.getElementById(id);

// ----------------------------------------------------------- word diff ----
// Plain LCS over whitespace-separated tokens. Dedup texts are near-identical
// by construction and only ~60 words long, so the O(n*m) table is trivial -
// and seeing *which* words differ is the whole reason for a side-by-side view.
function diffWords(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1
                               : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const left = [], right = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { left.push(["=", A[i]]); right.push(["=", B[j]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { left.push(["-", A[i++]]); }
    else { right.push(["+", B[j++]]); }
  }
  while (i < n) left.push(["-", A[i++]]);
  while (j < m) right.push(["+", B[j++]]);
  return [left, right];
}

function renderDiff(parts) {
  const frag = document.createDocumentFragment();
  for (const [op, tok] of parts) {
    // textContent everywhere: the questions are arbitrary scraped strings
    if (op === "=") frag.append(document.createTextNode(tok));
    else {
      const el = document.createElement(op === "-" ? "del" : "ins");
      el.textContent = tok;
      frag.append(el);
    }
  }
  return frag;
}

// -------------------------------------------------------------- render ----
function side(label, id, parts) {
  const box = document.createElement("div");
  box.className = "side";
  const h = document.createElement("h3");
  h.textContent = label + " ";
  const idEl = document.createElement("span");
  idEl.className = "id";
  idEl.textContent = id;
  h.append(idEl);
  const body = document.createElement("div");
  body.className = "text";
  body.append(renderDiff(parts));
  box.append(h, body);
  return box;
}

/** Candidate labels for a row: the contested ones first, then the rest. */
function candidates(p) {
  const contested = p.pair ?? [...new Set(Object.values(p.labels ?? {}))];
  return [...contested, ...vocabulary.filter((l) => !contested.includes(l))];
}

function labelBody(p, key) {
  const frag = document.createDocumentFragment();

  if (p.abstract) {
    const a = document.createElement("div");
    a.className = "abstract";
    const v = document.createElement("span");
    v.textContent = p.abstract;     // textContent: it is model-generated text
    a.append(v);
    frag.append(a);
  }

  const q = document.createElement("div");
  q.className = "question side";
  q.textContent = p.text || "(no text - pass --source to compare.py)";
  frag.append(q);

  const chips = document.createElement("div");
  chips.className = "chips";
  const contested = p.pair ?? [];
  candidates(p).forEach((label, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.label = label;
    // number only the contested ones: those are the 1/2 keyboard picks
    b.textContent = (i < contested.length ? `${i + 1}. ` : "") + label;
    const who = Object.entries(p.labels ?? {})
      .filter(([, l]) => l === label).map(([m]) => m);
    if (who.length) {
      const tag = document.createElement("span");
      tag.className = "who";
      tag.textContent = who.join(", ");
      b.append(tag);
    }
    b.onclick = () => decide(key, label);
    chips.append(b);
  });
  frag.append(chips);
  return frag;
}

function card(p, index) {
  const key = keyOf(p);
  const el = document.createElement("article");
  el.className = "card";
  el.tabIndex = 0;
  el.dataset.key = key;
  el.dataset.index = index;

  const meta = document.createElement("div");
  meta.className = "meta";
  if (MODE === "dedup") {
    const score = document.createElement("span");
    score.className = "score";
    score.textContent = Number(p.score).toFixed(4);
    meta.append(score);
  } else {
    const tag = document.createElement("span");
    tag.className = "pairtag";
    tag.textContent = (p.pair ?? []).join("  vs  ");
    const idEl = document.createElement("span");
    idEl.className = "id";
    idEl.textContent = p.id;
    meta.append(tag, idEl);
  }
  const pos = document.createElement("span");
  pos.textContent = `#${index + 1} of ${pairs.length}`;
  meta.append(pos);
  el.append(meta);

  if (MODE === "dedup") {
    const row = document.createElement("div");
    row.className = "pair";
    const [la, rb] = diffWords(p.a ?? "", p.b ?? "");
    row.append(side("A", p.a_id ?? "?", la), side("B", p.b_id ?? "?", rb));
    el.append(row);

    const actions = document.createElement("div");
    actions.className = "actions";
    const merge = document.createElement("button");
    merge.className = "merge"; merge.textContent = "Merge";
    const reject = document.createElement("button");
    reject.className = "reject"; reject.textContent = "Reject";
    const verdict = document.createElement("span");
    verdict.className = "verdict";
    merge.onclick = () => decide(key, "merge");
    reject.onclick = () => decide(key, "reject");
    actions.append(merge, reject, verdict);
    el.append(actions);
  } else {
    el.append(labelBody(p, key));
  }

  paint(el);
  return el;
}

function paint(el) {
  const d = decisions[el.dataset.key] || "";
  if (MODE === "dedup") {
    el.dataset.decision = d;
    const [merge, reject] = el.querySelectorAll(".actions button");
    merge.setAttribute("aria-pressed", String(d === "merge"));
    reject.setAttribute("aria-pressed", String(d === "reject"));
    el.querySelector(".verdict").textContent =
      d === "merge" ? "same question - merge" :
      d === "reject" ? "different questions - keep both" : "undecided";
  } else {
    el.dataset.decision = d ? "chosen" : "";
    for (const b of el.querySelectorAll("button.chip"))
      b.setAttribute("aria-pressed", String(b.dataset.label === d));
  }
}

function visible() {
  const f = $("filter").value;
  const wanted = $("pairfilter").value;
  return pairs
    .map((p, i) => [p, i])
    .filter(([p]) => {
      const d = decisions[keyOf(p)] || "";
      if (MODE === "label" && wanted && wanted !== "all"
          && (p.pair ?? []).join(" vs ") !== wanted) return false;
      if (f === "all") return true;
      if (f === "undecided") return d === "";
      if (f === "decided") return d !== "";
      return d === f;                       // dedup: merge / reject
    });
}

function render() {
  const list = $("list");
  list.textContent = "";
  const rows = visible();
  for (const [p, i] of rows) list.append(card(p, i));
  $("empty").style.display = pairs.length === 0 ? "" : "none";
  if (pairs.length && rows.length === 0) {
    const none = document.createElement("p");
    none.className = "empty";
    none.textContent = "Nothing matches this filter.";
    list.append(none);
  }
  updateCounts();
}

function updateCounts() {
  const vals = pairs.map((p) => decisions[keyOf(p)] || "");
  const done = vals.filter((v) => v !== "").length;
  let detail = "";
  if (MODE === "dedup") {
    const m = vals.filter((v) => v === "merge").length;
    detail = ` &nbsp;·&nbsp; ${m} merge &nbsp;·&nbsp; ${done - m} reject`;
  }
  $("counts").innerHTML = pairs.length
    ? `<b>${done}</b>/${pairs.length} decided${detail}` : "";
  $("progress").style.width = pairs.length ? `${(done / pairs.length) * 100}%` : "0";
  $("export").disabled = done === 0;
  $("clear").disabled = done === 0;
}

// ------------------------------------------------------------ decisions ----
function decide(key, verdict) {
  // clicking the active verdict again clears it, so a misclick is one click
  if (decisions[key] === verdict) delete decisions[key];
  else decisions[key] = verdict;
  save();

  const el = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  if (!el) return;
  if ($("filter").value === "all") {
    paint(el);
    updateCounts();
    focusNext(el);            // keep moving down the queue
  } else {
    render();                 // the card no longer belongs in this filter
  }
}

function focusNext(el) {
  const next = el.nextElementSibling;
  if (next && next.classList.contains("card")) next.focus();
}

function save() {
  if (storeKey) localStorage.setItem(storeKey, JSON.stringify(decisions));
}

// --------------------------------------------------------------- loading ----
function loadText(name, text) {
  const rows = [];
  text.split("\n").forEach((line, n) => {
    line = line.trim();
    if (!line) return;
    try { rows.push(JSON.parse(line)); }
    catch { console.warn(`line ${n + 1}: not valid JSON, skipped`); }
  });
  if (!rows.length) { alert(`${name}: no JSON lines found.`); return; }

  // the shape decides the mode; nothing else in the page has to be told
  if ("a_id" in rows[0] && "b_id" in rows[0]) MODE = "dedup";
  else if ("labels" in rows[0]) MODE = "label";
  else {
    alert(`${name}: unrecognised shape.\n\n` +
          `Expected either a dedup review file (score / a / b / a_id / b_id)\n` +
          `or a compare.py disagreements file (id / pair / labels / text).`);
    return;
  }

  pairs = rows;
  vocabulary = MODE === "label"
    ? [...new Set(rows.flatMap((r) => Object.values(r.labels ?? {})))].sort()
    : [];
  storeKey = `tcf.review.${name}`;
  decisions = JSON.parse(localStorage.getItem(storeKey) || "{}");
  $("filename").textContent = name;
  $("title").textContent = MODE === "dedup" ? "Dedup review" : "Label review";

  // dedup verdicts are fixed; label mode filters by cluster instead
  $("filter").innerHTML = MODE === "dedup"
    ? `<option value="all">All</option><option value="undecided">Undecided</option>
       <option value="merge">Merged</option><option value="reject">Rejected</option>`
    : `<option value="all">All</option><option value="undecided">Undecided</option>
       <option value="decided">Decided</option>`;

  const pf = $("pairfilter");
  pf.hidden = MODE !== "label";
  if (MODE === "label") {
    // one entry per label pair, biggest cluster first: fixing a rule beats
    // adjudicating rows, and this is how you see which rule to fix
    const counts = {};
    for (const r of rows) {
      const k = (r.pair ?? []).join(" vs ");
      counts[k] = (counts[k] || 0) + 1;
    }
    pf.innerHTML = `<option value="all">All pairs (${rows.length})</option>`
      + Object.entries(counts).sort((a, b) => b[1] - a[1])
          .map(([k, n]) => `<option value="${k}">${k} (${n})</option>`).join("");
  }
  render();
}

$("file").onchange = (e) => {
  const f = e.target.files[0];
  if (f) f.text().then((t) => loadText(f.name, t));
};

// drag-and-drop anywhere, since file:// pages cannot fetch a path themselves
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) f.text().then((t) => loadText(f.name, t));
});

$("filter").onchange = render;
$("pairfilter").onchange = render;

$("clear").onclick = () => {
  if (!confirm("Forget every decision recorded for this file?")) return;
  decisions = {};
  save();
  render();
};

$("export").onclick = () => {
  // one line per *decided* row; undecided ones are simply absent, so an export
  // can be appended to over several sittings without contradicting itself
  const lines = pairs
    .filter((p) => decisions[keyOf(p)])
    .map((p) => JSON.stringify(MODE === "dedup"
      ? { a_id: p.a_id, b_id: p.b_id, score: p.score, decision: decisions[keyOf(p)] }
      // same {id, <answer>, model} shape llm.py writes, so an adjudicated file
      // loads straight through load_labels.py and doubles as a gold set.
      // The key comes from the file (compare.py records which field the runs
      // answered) - hardcoding it here once produced `topic` for a `theme`
      // task, which load_labels.py rightly refused.
      : { id: p.id, [p.field || "theme"]: decisions[keyOf(p)], model: "human" }));
  const stem = ($("filename").textContent || "review").replace(/\.jsonl$/, "");
  const url = URL.createObjectURL(
    new Blob([lines.join("\n") + "\n"], { type: "application/x-ndjson" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `${stem}_decisions.jsonl`;
  a.click();
  URL.revokeObjectURL(url);
};

// ------------------------------------------------------------- keyboard ----
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const cards = [...document.querySelectorAll(".card")];
  if (!cards.length) return;
  const cur = document.activeElement.closest?.(".card");
  const at = cur ? cards.indexOf(cur) : -1;

  if (e.key === "j" || e.key === "ArrowDown") {
    e.preventDefault(); cards[Math.min(at + 1, cards.length - 1)].focus();
  } else if (e.key === "k" || e.key === "ArrowUp") {
    e.preventDefault(); cards[Math.max(at - 1, 0)].focus();
  } else if (cur && e.key === "u") {
    e.preventDefault();
    delete decisions[cur.dataset.key];
    save(); paint(cur); updateCounts();
  } else if (cur && MODE === "dedup" && (e.key === "m" || e.key === "r")) {
    e.preventDefault(); decide(cur.dataset.key, e.key === "m" ? "merge" : "reject");
  } else if (cur && MODE === "label" && /^[1-9]$/.test(e.key)) {
    // 1..9 pick the nth chip, so the two contested labels are 1 and 2
    const chip = cur.querySelectorAll("button.chip")[Number(e.key) - 1];
    if (chip) { e.preventDefault(); decide(cur.dataset.key, chip.dataset.label); }
  }
});
</script>
</body>
</html>
